name: Выпуск

# Выпуск по тегу: git tag v3.0.0-beta && git push origin v3.0.0-beta
# Тег должен совпадать с APP_VERSION в config.py, а в CHANGELOG.md должен быть раздел этой версии.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # Пробная сборка без выпуска: .exe прикладывается к запуску как артефакт

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: PyInstaller со своим загрузчиком
        # Антивирусы часто ложно срабатывают на стандартный загрузчик PyInstaller (его же используют вирусы).
        # Загрузчик, собранный из исходников, с их сигнатурами не совпадает.
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          $version = python -c "import PyInstaller; print(PyInstaller.__version__)"
          pip install --force-reinstall --no-deps --no-binary pyinstaller "pyinstaller==$version"

      - name: Тег совпадает с версией программы
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = python -c "import build; print(build.VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Тег ${{ github.ref_name }} не совпадает с APP_VERSION $version" }

      - name: Тесты
        run: |
          python -m pytest -q
          python tools/i18n_check.py

      - name: Сборка .exe
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}  # Встраивается в .exe; в git ключа нет
        run: python build.py

      - name: Файлы выпуска
        shell: pwsh
        run: |
          Copy-Item "dist/Minecraft Mod Updater beta.exe" ModUpdater.exe
          Copy-Item (Get-ChildItem "Minecraft Mod Updater beta_v*.zip" | Select-Object -First 1).FullName ModUpdater.zip
          $hash = (Get-FileHash ModUpdater.exe -Algorithm SHA256).Hash.ToLower()
          # Формат sha256sum с переводом строки \n — проверяется и программой, и `sha256sum -c`
          [IO.File]::WriteAllText("$PWD/ModUpdater.exe.sha256", "$hash  ModUpdater.exe`n")
          if ("${{ github.event_name }}" -eq "push") { python tools/release_notes.py "${{ github.ref_name }}" notes.md }

      - name: Пробная сборка — .exe к запуску
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: ModUpdater-test-build
          path: ModUpdater.exe

      - name: Выпуск на GitHub
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $flags = @()
          if ($tag.Contains("-")) { $flags += "--prerelease" }  # beta, rc — предварительный выпуск
          gh release create $tag ModUpdater.exe ModUpdater.zip ModUpdater.exe.sha256 `
            --title "Minecraft Mod Updater $($tag.TrimStart('v'))" --notes-file notes.md @flags
