name: Тесты

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Юнит-тесты
        run: python -m pytest -q
      - name: Перевод
        run: python tools/i18n_check.py
      - name: Проверка кода (pyflakes)
        run: python -m pyflakes .
      - name: Ключи не в git
        shell: pwsh
        run: |
          if (git ls-files _build_secrets.py) { Write-Error "_build_secrets.py попал в git — удалите его из репозитория и перевыпустите ключ"; exit 1 }
